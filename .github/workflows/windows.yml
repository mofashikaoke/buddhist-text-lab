name: Build Windows installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies
        run: python -m pip install -r requirements-desktop.txt pyinstaller
      - name: Test research and AI functions
        run: python -m unittest -v
      - name: Build application folder
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name BuddhistTextLab --add-data "web;web" --collect-all pypdf --collect-all opencc --collect-all certifi --collect-all webview desktop.py
      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/BuddhistTextLab/BuddhistTextLab.exe -ArgumentList '--smoke-test', 'smoke-result.txt' -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw 'Executable smoke test timed out' }
          if ($p.ExitCode -ne 0 -or -not (Test-Path smoke-result.txt)) { Get-Content smoke-result.txt.log -ErrorAction SilentlyContinue; throw 'Executable smoke test failed' }
          Get-Content smoke-result.txt
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Prepare Microsoft WebView2 runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer-assets | Out-Null
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile installer-assets/MicrosoftEdgeWebview2Setup.exe
          $sig = Get-AuthenticodeSignature installer-assets/MicrosoftEdgeWebview2Setup.exe
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'Invalid Microsoft runtime signature' }
          $p = Start-Process installer-assets/MicrosoftEdgeWebview2Setup.exe -ArgumentList '/silent', '/install' -Wait -PassThru
      - name: Compile installer
        shell: pwsh
        run: |
          $version = "0.4.${{ github.run_number }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/BuddhistTextLab.iss /DAppVersion="$version"
          $setup = Get-ChildItem installer-output/BuddhistTextLab-Setup-*.exe | Select-Object -First 1
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($setup.Name)" | Out-File installer-output/SHA256SUMS.txt -Encoding ascii
          "SETUP_NAME=$($setup.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SETUP_PATH=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Validate install, upgrade, native window and uninstall
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'BuddhistTextLab-Installed'
          $data = Join-Path $env:LOCALAPPDATA 'BuddhistTextLab'
          New-Item -ItemType Directory -Force $data | Out-Null
          'keep-me' | Set-Content (Join-Path $data 'installer-test-sentinel.txt')
          function Install-App {
            $p = Start-Process $env:SETUP_PATH -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$dest" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Installer exit $($p.ExitCode)" }
          }
          Install-App
          Install-App
          $exe = Join-Path $dest 'BuddhistTextLab.exe'
          if (-not (Test-Path $exe)) { throw 'Installed executable missing' }
          $shortcut = Join-Path $env:ProgramData 'Microsoft/Windows/Start Menu/Programs/佛典研究工作台/佛典研究工作台.lnk'
          if (-not (Test-Path $shortcut)) { throw 'Start menu shortcut missing' }
          $p = Start-Process $exe -ArgumentList '--gui-smoke-test', "$env:RUNNER_TEMP/gui-smoke.txt" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw 'Native GUI test timed out' }
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$env:RUNNER_TEMP/gui-smoke.txt")) { Get-Content "$env:RUNNER_TEMP/gui-smoke.txt.log" -ErrorAction SilentlyContinue; throw 'Native GUI test failed' }
          Get-Content "$env:RUNNER_TEMP/gui-smoke.txt"
          $p = Start-Process (Join-Path $dest 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or (Test-Path $exe)) { throw 'Uninstall failed' }
          if (-not (Test-Path (Join-Path $data 'installer-test-sentinel.txt'))) { throw 'Uninstall removed user data' }
      - uses: actions/upload-artifact@v4
        with:
          name: BuddhistTextLab-Setup
          path: |
            installer-output/BuddhistTextLab-Setup-*.exe
            installer-output/SHA256SUMS.txt
          retention-days: 90
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.4.${{ github.run_number }}"
          gh release create $tag $env:SETUP_PATH installer-output/SHA256SUMS.txt --target '${{ github.sha }}' --title "佛典研究工作台 $tag · Windows 安装程序" --notes-file WINDOWS.md
