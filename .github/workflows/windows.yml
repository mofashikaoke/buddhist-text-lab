name: Build Windows installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Test research and AI functions
        run: python -m unittest -v
      - name: Build application folder
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name BuddhistTextLab --add-data "web;web" --collect-all pypdf desktop.py
      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/BuddhistTextLab/BuddhistTextLab.exe -ArgumentList '--smoke-test', 'smoke-result.txt' -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw 'Executable smoke test timed out' }
          if ($p.ExitCode -ne 0 -or -not (Test-Path smoke-result.txt)) { throw 'Executable smoke test failed' }
          Get-Content smoke-result.txt
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Compile installer
        shell: pwsh
        run: |
          $version = "0.3.${{ github.run_number }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/BuddhistTextLab.iss /DAppVersion="$version"
          $setup = Get-ChildItem installer-output/BuddhistTextLab-Setup-*.exe | Select-Object -First 1
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($setup.Name)" | Out-File installer-output/SHA256SUMS.txt -Encoding ascii
          "SETUP_NAME=$($setup.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SETUP_PATH=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/BuddhistTextLab -DestinationPath installer-output/BuddhistTextLab-Windows-x64-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BuddhistTextLab-Setup
          path: |
            installer-output/BuddhistTextLab-Setup-*.exe
            installer-output/SHA256SUMS.txt
          retention-days: 90
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.3.${{ github.run_number }}"
          gh release create $tag $env:SETUP_PATH installer-output/SHA256SUMS.txt installer-output/BuddhistTextLab-Windows-x64-portable.zip --target '${{ github.sha }}' --title "佛典研究工作台 $tag · Windows 安装程序" --notes-file WINDOWS.md
